onboarding = false
[theme]
name = "kanagawa"
auto_switch = false

[theme.custom]
# Conductor-style: neutral near-black surfaces, tiny value gaps between them,
# no colored accent in the chrome. Base theme stays kanagawa so the chromatic
# tokens it supplies (status dots, git status) keep their meaning.
# Elevation runs outer-light to inner-dark: the terminal is the darkest surface
# and the chrome around it lifts.
# sidebar #161616 (outermost) -> pane frame #101010 -> terminal content #0C0C0C
# (that last one is Ghostty's `background`, not a herdr token).
sidebar_bg    = "#161616"
panel_bg      = "#101010"
surface_dim   = "#141414"
surface0      = "#1C1C1C"
surface1      = "#262626"
active_row_bg = "#242424"
selection_bg  = "#2E2E2E"
overlay0      = "#5A5A5A"
overlay1      = "#767676"
subtext0      = "#909090"
text          = "#EDEDED"
# Bright chip. herdr has no underline-style tab, so the active tab is always a
# filled block; mid-gray made the label unreadable, so back to near-white.
accent        = "#E8E8E8"

# Status dots. herdr colors state_icon from the palette, never from the
# ui.sidebar rules below — state_icon carries no text value, so `rules` can't
# match it (src/client/shell.rs status_color: working=yellow, blocked=red,
# done=teal, idle=green, unknown=overlay0). Remap those four so the dots land
# in the same register as the state_text rules.
# Collateral, accepted: green also paints the git ahead count, the endpoint
# "online" dot and the settings "installed" check; yellow also paints
# connecting/reconnecting, "update available" and the status-bar highlight bg.
red    = "#FF5D62"  # blocked
green  = "#E6C384"  # idle    — no longer a green
teal   = "#98BB6C"  # done
yellow = "#8A8A8A"  # working — no longer a yellow

[ui]
show_agent_labels_on_pane_borders = true

agent_panel_sort = "spaces"

# Matches theme.custom.accent above.
accent = "#E8E8E8"

# Tab row always on, even for a single tab. Hiding it made the row appear and
# disappear as tabs came and went, which shifted the pane contents down a line.
hide_tab_bar_when_single_tab = false

# pane_borders stays at the default "auto" (split panes only). 0.9.0 added
# "always", which also frames a lone pane; tried 2026-09-08 and reverted. The
# theme above builds elevation from value gaps between surfaces, not strokes,
# so a 1px overlay0 line against near-black was invisible enough to be
# indistinguishable and, when noticed, read as an artifact. With one pane and
# the tab bar hidden it was the only line on screen. pane_gaps (default true)
# already exposes the panel_bg layer as area, which is the intended language.

status_indicators = "dots"
[ui.toast]
delivery = "terminal"

# Separate delivery path from the cmux notification hooks, which are
# best-effort and silently drop alerts under load.
[ui.sound]
enabled = true

# Per-token colors for the sidebar rows. Defaults leaned on kanagawa's chromatic
# tokens (purple branches) and on `dim`, which made the tab and agent names
# nearly unreadable against the lifted sidebar. Explicit neutrals instead.
[ui.sidebar.spaces]
# 0.9.0 value rules: one condition per rule (equals/contains/starts_with/gt/lt),
# first match wins, unmatched falls through to the token's base style.
# git_status stays unstyled on purpose: an fg override there flattens its
# built-in green/red ahead-behind counts into a single color.
#
# main/master is a CAUTION: a commit here lands on the trunk. It shares
# carpYellow with the agent rows' `idle` state on purpose — one "wants your
# attention" yellow across the whole sidebar rather than a separate shade per
# meaning. The two never appear in the same row (Spaces vs Agents are separate
# panels), so the shared color reads as one register, not as ambiguity.
#
# Rejected: roninYellow #FF9E3B, the original pick, sat 20 degrees off carpYellow
# — close enough to look like a mistake rather than a match. Also rejected:
# crystalBlue #7E9CD8, which separates cleanly (118 degrees) but is the calmest
# hue on the wheel, so it argued against the warning this rule exists to give;
# and #CCA694 (Conductor's --status-done), warm but at C 0.052 too quiet to
# register as a caution at a glance.
#
# $snooze is reported by the herdr-snooze plugin (dotfiles/herdr-snooze, linked
# with `herdr plugin link`, not stowed). It renders "💤 2h" on a snoozed Space
# and is absent otherwise. fujiGray + dim on purpose: a snoozed Space is one
# you deliberately pushed away, so it should recede below the live rows rather
# than compete with them.
rows = [
  # A snoozed Space is renamed with a 💤 prefix by the herdr-snooze plugin.
  # The rename is the whole mechanism: value rules match a token against its
  # own value, so there is no way to dim `workspace` from separate snooze
  # metadata. The prefix has to be in the name for this rule to see it, and
  # it must stay in step with BADGE in snooze.py.
  ["state_icon", { token = "workspace", rules = [
     { starts_with = "💤 ", fg = "#54546D", dim = true },
   ] }, { token = "$snooze", fg = "#54546D", dim = true }],
  # $branch_ is the plugin's copy of the branch name, not the built-in token.
  # Same reason as the workspace row above: a rule only sees its own token's
  # value, so fading a snoozed Space's branch needs the plugin to own it and
  # prefix it. git_status stays built-in and keeps its green/red counts.
  #
  # Cost of this: if the snooze ticker dies, branch names fade from the whole
  # sidebar once the 24h token TTL lapses. Swap back to "branch" to undo.
  # The first rule matches a zero-width space (U+200B) that the plugin puts in
  # front of a snoozed Space's branch. Invisible on purpose: the 💤 is already
  # on the name row and repeating it here read as clutter. It must come first,
  # so a snoozed `main` fades instead of taking the caution colour below.
  [{ token = "$branch_", fg = "#8A8A8A", dim = false, rules = [
     { starts_with = "​", fg = "#54546D", dim = true },
     { equals = "main",   fg = "#E6C384" },
     { equals = "master", fg = "#E6C384" },
   ] }, "git_status"],
]

[ui.sidebar.agents]
# state_text colors mirror bin/bin/herdr-agent-picker so the sidebar and the
# prefix+a popup agree on what a status means:
#   blocked -> peachRed    (permission prompt: unblock me now)
#   idle    -> carpYellow   (waiting on your input)
#   done    -> springGreen (finished, go look)
#   working/unknown -> base grey (leave it alone)
#
# The 💤 rules fade an agent living in a snoozed Space. They work for free:
# the agent row's `workspace` token is the Space's label, and herdr-snooze
# renames a sleeping Space with a 💤 prefix, so the marker is already in the
# value a rule can see. Only `workspace` carries it, so the rest of the row
# keeps its normal colour; state_text still shouts if such an agent blocks.
rows = [
  ["state_icon", { token = "workspace", rules = [
     { starts_with = "💤 ", fg = "#54546D", dim = true },
   ] }, { token = "tab", fg = "#B4B4B4", dim = false },
   { token = "state_text", fg = "#8A8A8A", dim = false, rules = [
     { equals = "blocked", fg = "#FF5D62", bold = true },
     { equals = "idle",    fg = "#E6C384" },
     { equals = "done",    fg = "#98BB6C" },
   ] }],
  [{ token = "agent", fg = "#8A8A8A", dim = false }],
]

[keys]
# Carried over from tmux muscle-memory; the tmux config itself is gone, the
# annotations below just record where each binding came from.
prefix = "ctrl+space"            # tmux: set -g prefix C-Space
workspace_picker = "prefix+s"    # tmux: bind s choose-tree (workspace ≈ tmux session)
goto = "prefix+w"                # tmux: bind w choose-tree (navigator: workspaces/tabs/panes)
focus_agent = "prefix+alt+1..9"  # jump straight to agent N by number
settings = "prefix+shift+s"      # moved off prefix+s
rename_tab = "prefix+r"          # tmux: bind , rename-window (reload via CLI: herdr server reload-config)
resize_mode = "prefix+shift+r"   # moved off prefix+r
split_horizontal = "prefix+quote"    # tmux: bind '"' -> stacked panes
split_vertical = "prefix+percent"    # tmux: bind % -> side-by-side panes
# focus_pane_{left,down,up,right} = prefix+h/j/k/l already match tmux defaults
# new_tab = prefix+c already matches tmux `bind c new-window`

# Optional bindings added in 0.8.0, unset by default. All three are tmux
# muscle-memory that the original port had no herdr equivalent for.
last_pane = "prefix+semicolon"           # tmux: bind ';' last-pane
move_tab_previous = "prefix+shift+comma" # tmux: bind '<' swap-window -t -1
move_tab_next = "prefix+shift+period"    # tmux: bind '>' swap-window -t +1

# Moved off prefix+z (herdr's default), which is now snooze — see the
# [[keys.command]] block below. tmux zoom is prefix+z too, so this one costs
# some muscle memory; shift+z keeps it on the same letter.
zoom = "prefix+shift+z"

# Navigate-mode (goto, prefix+w): vim j/k walk the spaces list instead of arrows.
# This takes j/k off pane up/down, so arrows drive pane vertical (arrows already
# do pane left/right). Net: j/k = spaces, arrows = panes.
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_up = "up"
navigate_pane_down = "down"

# prefix+a -> fzf popup to pick/jump to any running agent (a UI, not cycling)
[[keys.command]]
key = "prefix+a"
type = "popup"
description = "Agents"          # shown as the popup border label (was "popup")
# Resolved via PATH, not an absolute path: the bin package stows to ~/bin, which
# .zshrc puts on PATH on every machine. A hardcoded /Users/... path made this
# config macOS-only and was the reason herdr wasn't stowed on Linux at all.
command = "herdr-agent-picker"
width = "70%"
height = "60%"

# prefix+z -> snooze the current Space: it sinks to the bottom of the sidebar
# with a countdown, then comes back with an alert when the timer ends.
# Provided by the herdr-snooze plugin; the binding is inert without it, so this
# stays safe on a machine where the plugin was never linked.
#
# zzz for sleep. `s` was unavailable in every form: prefix+s is workspace_picker
# and prefix+shift+s is settings.
#
# This takes prefix+z off zoom, which is herdr's default for it. Zoom moved to
# prefix+shift+z below rather than being lost.
[[keys.command]]
key = "prefix+z"
type = "plugin_action"
command = "jeordin.snooze.snooze-picker"
description = "Snooze"

[session]
# After a server restart (reboot, `herdr server stop`, `herdr update`), reattach
# agent panes to the conversation they were in instead of dropping to a bare
# shell. session.json already stores each pane's cwd + agent session id; this is
# what makes it actually resume them. Set explicitly — do not rely on the default.
resume_agents_on_restore = true

[experimental]
# The other half of session.resume_agents_on_restore below: that brings the
# agent's conversation back after a restart, this brings its scrollback back.
# Without it a resumed pane returns with an empty screen.
pane_history = true

# Forward Kitty graphics to the outer terminal so image previews render inside
# herdr panes (yazi, etc.). Outer terminal is Ghostty, which supports KGP.
# Without this herdr eats the escapes and yazi falls back to chafa.
kitty_graphics = true
