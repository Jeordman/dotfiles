gui:
  disableStartupPopups: true
  theme:
    # Neutral surfaces from herdr/catppuccin; #3A3A3A is nvim's FloatBorder.
    activeBorderColor: ['#E8E8E8']
    inactiveBorderColor: ['#3A3A3A']
    searchingActiveBorderColor: ['#E2D1AD']
    optionsTextColor: ['#767676']
    selectedLineBgColor: ['#242424']          # herdr active_row_bg
    inactiveViewSelectedLineBgColor: ['#1C1C1C']
    cherryPickedCommitFgColor: ['#91ADDB']
    cherryPickedCommitBgColor: ['#242424']
    markedBaseCommitFgColor: ['#E2D1AD']
    markedBaseCommitBgColor: ['#242424']
    unstagedChangesColor: ['#D95F5F']         # true red (hue 0), matches nvim git red
    defaultFgColor: ['#EDEDED']
  # One gray for every author instead of per-author cyan/magenta.
  authorColors:
    '*': '#909090'
git:
  pull:
    mode: "rebase"

os:
  # ~/bin/clipcopy picks pbcopy / wl-copy / xclip by platform.
  copyToClipboardCmd: 'printf "%s" "{{text}}" | "$HOME/bin/clipcopy"'
  editPreset: 'nvim'
customCommands:
  - key: 'o'
    context: 'commitFiles'
    command: 'nvim -- {{.SelectedCommitFile.Name | quote}}'
    output: terminal
  - key: 'e'
    context: 'commitFiles'
    command: 'nvim -- {{.SelectedCommitFile.Name | quote}}'
    output: terminal
