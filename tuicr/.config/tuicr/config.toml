# Neutral palette shared with ghostty/, herdr/, and nvim/.
# Defined in themes/conductor.toml alongside this file.
theme = "conductor"

# The first entry is the default type for a new comment; Tab / S-Tab cycles.
# Untyped stays available at the end of the cycle.
comment_types = [
  { id = "note", definition = "neutral remark, no action implied" },
  { id = "issue", definition = "problem to fix before merge", color = "red" },
  { id = "suggestion", definition = "possible improvement", color = "yellow" },
  { id = "nit", definition = "small optional tweak", color = "#d19a66" },
  { id = "question", definition = "ask for clarification", color = "cyan" },
  { id = "praise", definition = "positive feedback", color = "green" },
]

[forge]
# Don't prepend `[ISSUE]` / `[PRAISE]` to comment bodies posted to GitHub.
# The types are for the TUI (colored badges, Tab cycling) and for the
# `Comment types:` legend in the LLM export — both unaffected by this.
comment_type_prefix = false
