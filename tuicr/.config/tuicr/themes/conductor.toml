# Matches the neutral palette shared by ghostty/, herdr/, and nvim/.
# tuicr has no base bg key: it inherits the terminal background, which
# Ghostty already sets to #0C0C0C.
#
# Shared anchors:
#   #0C0C0C terminal      #101010 herdr panel_bg   #161616 herdr sidebar_bg
#   #242424 active row    #2E2E2E selection        #3A3A3A border

# Surfaces and text
panel_bg     = "#101010"
bg_highlight = "#242424"
fg_primary   = "#EDEDED"
fg_secondary = "#B4B4B4"
fg_dim       = "#909090"

# Diff line backgrounds: the accent hue mixed ~12% into the terminal ground,
# so a changed line reads as a wash rather than a colored block.
diff_add            = "#A4CCA1"
diff_del            = "#F38BA8"
diff_add_bg         = "#1E231E"
diff_del_bg         = "#281B1F"
diff_context        = "#909090"
diff_hunk_header    = "#909090"
expanded_context_fg = "#5A5A5A"

# Intra-line word diff, same hues at ~25% so they sit above the line wash.
syntax_add_bg = "#323C31"
syntax_del_bg = "#462C33"

# File status. Desaturated to match nvim, except deleted, which stays stock
# loud for the same reason `red` stayed stock in catppuccin.
file_added    = "#A4CCA1"
file_modified = "#E2D1AD"
file_deleted  = "#F38BA8"
file_renamed  = "#91ADDB"

# Comment type badges
comment_note       = "#B4B4B4"
comment_suggestion = "#E2D1AD"
comment_issue      = "#F38BA8"
comment_praise     = "#A4CCA1"
# Unsubmitted/draft comments; peach so it reads apart from suggestion yellow.
# Per-item review state: peach for not-yet-reviewed, green for done.
pending            = "#DAAC8F"
reviewed           = "#A4CCA1"

# Chrome
border_focused   = "#767676"
border_unfocused = "#3A3A3A"
status_bar_bg  = "#101010"
cursor_color   = "#D0D0D0"
cursor_line_bg = "#242424"
branch_name    = "#8A8A8A"
help_indicator = "#767676"

# Messages: subtle washes rather than filled banners
message_info_fg    = "#B4B4B4"
message_info_bg    = "#1C1C1C"
message_warning_fg = "#E2D1AD"
message_warning_bg = "#282216"
message_error_fg   = "#F38BA8"
message_error_bg   = "#2A1A1F"

# Badges use the same bright chip as the herdr active tab
update_badge_fg = "#0C0C0C"
update_badge_bg = "#E8E8E8"
mode_fg         = "#0C0C0C"
mode_bg         = "#E8E8E8"
